name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build static frontend
        env:
          CLIENT_BASE_PATH: /bigapple-chinese/
        run: npx vite build --config vite.config.ts --base=/bigapple-chinese/ --outDir dist-pages
      - name: Flatten output for Pages
        run: |
          mv dist-pages/client/index.html dist-pages/index.html
          cp dist-pages/index.html dist-pages/404.html
      - name: Inject server-side template variables
        run: |
          f=dist-pages/index.html
          # Replace server-rendered template placeholders with static-safe values
          sed -i 's|{{appId}}|"static"|g' "$f"
          sed -i 's|{{userId}}|null|g' "$f"
          sed -i 's|{{tenantId}}|"static"|g' "$f"
          sed -i 's|{{userName}}|"Guest"|g' "$f"
          sed -i 's|{{csrfToken}}|""|g' "$f"
          sed -i 's|{{environment}}|"production"|g' "$f"
          sed -i 's|{{basename}}|"/bigapple-chinese/"|g' "$f"
          sed -i 's|{{appName}}|Big Apple Chinese|g' "$f"
          sed -i 's|{{{appAvatar}}}||g' "$f"
          sed -i 's|{{appDescription}}|Big Apple Chinese e-picturebook shop|g' "$f"
          sed -i "s|'{{{__platform__}}}'|'{}'|g" "$f"
          # also patch 404.html identically
          sed -i 's|{{appId}}|"static"|g' dist-pages/404.html
          sed -i 's|{{userId}}|null|g' dist-pages/404.html
          sed -i 's|{{tenantId}}|"static"|g' dist-pages/404.html
          sed -i 's|{{userName}}|"Guest"|g' dist-pages/404.html
          sed -i 's|{{csrfToken}}|""|g' dist-pages/404.html
          sed -i 's|{{environment}}|"production"|g' dist-pages/404.html
          sed -i 's|{{basename}}|"/bigapple-chinese/"|g' dist-pages/404.html
          sed -i 's|{{appName}}|Big Apple Chinese|g' dist-pages/404.html
          sed -i 's|{{{appAvatar}}}||g' dist-pages/404.html
          sed -i 's|{{appDescription}}|Big Apple Chinese e-picturebook shop|g' dist-pages/404.html
          sed -i "s|'{{{__platform__}}}'|'{}'|g" dist-pages/404.html
          echo "=== remaining placeholders (should be empty) ==="
          grep -oE '\{\{[^}]+\}\}' "$f" || echo "(none)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
